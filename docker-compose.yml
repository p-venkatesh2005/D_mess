version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dwaraka_mess_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dwaraka_mess}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dwaraka_mess}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dwaraka_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dwaraka_mess_app
    environment:
      FLASK_APP: app.py
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dwaraka_mess}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - dwaraka_network
    restart: unless-stopped
    # Uncomment for development with auto-reload
    # command: flask run --host=0.0.0.0

volumes:
  postgres_data:

networks:
  dwaraka_network:
    driver: bridge
